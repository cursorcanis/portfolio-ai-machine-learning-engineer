[package]
name = "ai-advisor-rs"
version = "0.1.0"
edition = "2024"
authors = ["Alfredo Alea <alfredoaleawork@gmail.com>"]

[dependencies]
# Offline language detection, used to name the response language explicitly
# in the chat prompt (see handler.rs::language_reminder).
whatlang = "0.16"
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for the Anthropic API (rustls — no system OpenSSL needed)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }

# Streaming
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "v5"] }
base64 = "0.22"
dotenvy = "0.15"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

# Vector DB + embeddings
qdrant-client = "1"
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }

# Production profile: thin LTO + stripped symbols cut the binary from ~99 MB
# (debug) to a fraction of that, with faster/leaner runtime. Local runs should
# use this too — debug builds waste CPU and RAM for no benefit once code works.
[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "ai-advisor-rs"
path = "src/main.rs"

[[bin]]
name = "migrate_kb"
path = "src/bin/migrate_kb.rs"
